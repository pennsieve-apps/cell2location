services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: cell2location:dev
    platform: linux/amd64
    mem_limit: 4g
    cpus: 4
    network_mode: none
    env_file:
      - dev.env
    volumes:
      - ./data/fixture/linked:/data/input:ro
      - ./data/output:/data/output
